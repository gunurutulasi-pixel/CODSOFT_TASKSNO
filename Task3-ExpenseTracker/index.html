<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Financial Management App</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fas fa-wallet"></i> Expense Tracker</h1>
            <p>Monitor your income and expenses with financial insights</p>
        </header>

        <!-- Summary Cards Overview -->
        <div class="summary-cards">
            <div class="card balance-card">
                <h3>Current Balance</h3>
                <p id="net-balance">₹0.00</p>
            </div>
            <div class="card-row">
                <div class="card income-card">
                    <h3>Total Income</h3>
                    <p id="total-income">₹0.00</p>
                </div>
                <div class="card expense-card">
                    <h3>Total Expenses</h3>
                    <p id="total-expense">₹0.00</p>
                </div>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="form-section">
            <h3>Add New Transaction</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Salary, Groceries, Rent..." required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" step="0.01" placeholder="Enter amount..." required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="General">General</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food & Dining</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills & Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <button type="submit" class="btn primary-btn"><i class="fas fa-plus"></i> Add Transaction</button>
            </form>
        </div>

        <!-- Transaction History Section -->
        <div class="history-section">
            <div class="history-header">
                <h3>Transaction History</h3>
                <div class="filter-group">
                    <label for="filter-category"><i class="fas fa-filter"></i> Filter:</label>
                    <select id="filter-category">
                        <option value="all">All Categories</option>
                        <option value="General">General</option>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food & Dining</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills & Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                    </select>
                </div>
            </div>

            <ul id="transaction-list">
                <!-- Dynamic Transactions Will Appear Here -->
            </ul>

            <div id="empty-state" class="hidden">
                <i class="fas fa-receipt"></i>
                <p>No transactions recorded yet.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
